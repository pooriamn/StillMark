name: Pooria Moozarm Nia
discipline: Monochrome Fine Art Photography
tagline: Monochrome photographs shaped by distance, witness, reflection, and brief
  forms of human nearness.
intro: STILLMRK moves through thresholds, shorelines, winter roads, and open ground
  where a person can appear small without disappearing.
about: 'Made across different places and years, the photographs are held together
  by recurrence rather than chronology. Trees return as witnesses, water reflects
  what cannot be kept, and weather reduces the frame to relation: between figure and
  land, solitude and the brief forms of solidarity that interrupt it.'
statement: The site pairs images with restrained narrative cues so the sequence can
  deepen without over-explaining the frame. New work belongs here only when it strengthens
  the language of threshold, witness, reflection, winter passage, or nearness.
status: Available for editions, exhibitions, editorial licensing, and selected collaborations.
