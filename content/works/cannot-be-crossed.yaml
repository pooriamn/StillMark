id: cannot-be-crossed
title: What Cannot Be Crossed
series: witness-horizon
year: Witness sequence
location: Snow field
alt: Solitary figure standing on a frozen lakeshore facing a leaning bare tree.
caption: Reflection lengthens the tree into the ice, but cannot close the distance
  around it. The lake remains suspended between hold and surrender, and the figure
  at its edge inherits the same condition. There are moments when thought is only
  another name for standing before what cannot be crossed.
