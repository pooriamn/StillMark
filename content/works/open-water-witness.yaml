id: open-water-witness
title: Open Water Witness
series: transit-of-stillness
year: Transit sequence
location: Open lake passage
alt: A lone paddler moves across a calm lake beneath overhanging tree branches, with
  mountains, clouds, and the figure reflected in the water.
caption: The series opens here into a wider field, but not into ease. Branches still
  hold the upper edge of the frame, while water extends outward with a calmer and
  larger authority. The paddler continues through that openness without mastering
  it, carried between reflection and distance. What changes at the end is not the
  world’s silence, only the scale in which passage must continue.
