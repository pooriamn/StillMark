alt: A lone figure stands in a snowy open field near a large leafless tree, with a
  curved line of footprints leading across the snow.
caption: Some distances are not crossed to reach another place, but to remain bearable
  within oneself. The snow receives each step without promise, and the path goes on
  without answer. What matters is not arrival, but the brief trace of a presence moving
  through silence.
