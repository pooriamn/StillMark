id: under-the-canopy
title: Under The Canopy
series: transit-of-stillness
year: Transit sequence
location: Framed water
alt: A kayaker moves across still water beneath overhanging tree branches, with the
  trees and clouds reflected across the lake surface.
caption: The surface is no longer crossed in the open. Branches gather above and reflection
  gathers below, turning passage into something more enclosed, more absorbed. The
  kayak moves with so little disturbance that motion begins to resemble listening.
  What travels through this frame does not break the stillness. It enters it, and
  is briefly carried within it.
