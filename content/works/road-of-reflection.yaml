title: Road Of Reflection
series: transit-of-stillness
year: Transit sequence
location: Reflective roadside
alt: A cyclist rides past a large tree along a road beside a broad reflective surface
  that mirrors both forms.
caption: The road carries movement forward, but the dark water keeps it for a moment
  longer. A tree remains at the margin like an old witness, while the passing wheel
  enters reflection without disturbing its calm. What moves through this frame is
  not speed, but a brief life received by stillness, doubled, and quietly released.
