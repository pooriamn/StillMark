caption: The scene feels almost unreal, not because it departs from the world, but
  because it reveals how little the world needs in order to become unrecognizable.
  A shore of snow, a black mirror of water, a suspended cloud, and one quiet presence
  at the edge. Sometimes reality is most unsettling when it refuses all noise.
