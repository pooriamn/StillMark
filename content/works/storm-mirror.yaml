location: Flood plain
alt: A cyclist passes a large tree reflected in water beneath a dramatic storm-dark
  sky.
caption: The weather has not yet broken, but the frame already knows its direction.
  The rider remains at the edge of motion while the tree gathers the sky above it
  with a heavier patience. Reflection holds both inside the same dark field, where
  passage seems briefly suspended, as if the world were deciding whether movement
  will continue or be overtaken.
