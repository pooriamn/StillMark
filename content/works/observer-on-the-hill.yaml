id: observer-on-the-hill
title: Before Departure Becomes Memory
year: Witness sequence
location: Ridge line
alt: A lone figure raises a camera as birds lift above a dark sloping hillside into pale sky.
caption: Above the dark ground, movement breaks into many directions at once. Below it, stillness
  lifts its hands as if witness could delay departure. It cannot. Some moments ask not to
  be saved, only to be seen with enough seriousness before they pass beyond recall.
