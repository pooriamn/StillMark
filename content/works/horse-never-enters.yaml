title: The Horse Never Enters
series: blood-wedding
year: '2026'
location: Unspecified
alt: Leonardo stands apart from a bridle and folded cloth on a bare black stage.
caption: 'Desire does not need to gallop in order to leave. It has already learned
  the road in secret, already rehearsed the distance between a house and a forbidden
  name. The absent horse becomes stronger than any body on stage: motion waiting for
  permission it will not ask for.'
