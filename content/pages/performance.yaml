content_builder_guide:
  visible: false
  eyebrow: Guide scaffolds
  title: Draft Stage Works in the Content Builder
  intro: Private guide cards for shaping theatre and performance stories before adding
    final images, captions, and cover works.
  items:
  - eyebrow: Stage Work guide
    title: Hamlet
    text: Use this scaffold for a performance sequence built around hesitation, repetition,
      interior conflict, and the figure suspended before action.
  - eyebrow: Stage Work guide
    title: Othello
    text: Use this scaffold for a performance sequence shaped by witness, proximity,
      accusation, trust, and controlled rupture.
  - eyebrow: Stage Work guide
    title: Blood Wedding
    text: Use this scaffold for a performance sequence built around ritual, pursuit,
      desire, social pressure, and consequence.
