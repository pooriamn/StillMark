projects:
  eyebrow: Stage Works
  title: Each staged work remains readable as a complete sequence.
  intro: 'These projects are organised by play or performance, but they are not simple
    documentation folders. They are ordered stories: each photograph has its own pressure,
    and the sequence lets those fragments build toward the larger work.'
  visible: true
structure:
  visible: true
  eyebrow: How to read this section
  title: Stage Works is a storytelling route, not an image dump.
  intro: Series and Stage Works use the same careful sequencing, but they answer different
    questions. Series begins from an authored photographic idea. Stage Works begins
    from a performed work and follows how body, space, light, and silence unfold across
    time.
  cards:
  - eyebrow: Route 01
    title: Stage work
    text: A play or performance treated as a complete photographic story, with its
      own context, cover, statement, and ending.
  - eyebrow: Route 02
    title: Sequence
    text: The order is intentional. The first image opens the threshold, the middle
      builds pressure, and the final image decides what remains.
  - eyebrow: Route 03
    title: Image as fragment
    text: Each photograph can stand alone, but its full meaning sharpens when it is
      read as one piece of the larger staged story.
