  eyebrow: Approach
  title: Image and narration should deepen one another, not compete.
  text: 'The work moves by recurrence rather than explanation: thresholds first, then
    open ground, reflection, weather, winter, and the rare moments when another presence
    changes the meaning of distance. Text appears only where it deepens the image.'
