meta:
  title: STILLMRK - Monochrome photography
  description: STILLMRK is a narrative monochrome photography portfolio built around
    thresholds, witness, reflection, winter passage, and quiet forms of solidarity.
  og_description: A monochrome sequence shaped by thresholds, water, snow, witness
    trees, and the emotional condition of distance.
  og_image: assets/images/social/quiet-lens-og-home.jpg
  og_image_alt: STILLMRK homepage social card with the title The Distance That Remains.
hero:
  eyebrow: STILLMRK / The Distance That Remains
  title: The Distance That Remains
  lead: 'These photographs move through roads, shorelines, winter fields, and built
    edges where a person can appear small without disappearing. Trees return as witnesses.
    Water reflects what cannot be held for long. Snow removes excess and leaves only
    relation: between one figure and another, between the body and the land, between
    solitude and the brief forms of solidarity that interrupt it. Made across different
    countries and years, the work is held together less by geography than by a recurring
    condition of distance - not as emptiness, but as a way of being present.'
  feature_work_id: mirror-shore
  feature_label: Lead image
  primary_action:
    label: View portfolio
    href: portfolio.html
    style: primary
  secondary_action:
    label: Explore series
    href: series.html
    style: secondary
  notes:
  - Series-led narrative
  - Across places and seasons
  - Quiet forms of nearness
