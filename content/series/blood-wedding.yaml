slug: blood-wedding
title: Blood Wedding
years: '2026'
mood: Blood wedding, lorca, bride, fate, aftermath.
description: '*Blood Wedding* is treated here as a tragedy of promises that are already
  wounded before they are broken. The wedding should create continuity, but Lorca''s
  world turns continuity into inheritance: land, silence, desire, family pride, and
  grief passing from one generation to the next.

  This sequence follows the play through what remains rather than through spectacle.
  A wreath, a bridle, an empty chair, a threshold of light, two abandoned coats, a
  folded blanket, and a knot of thread carry the pressure of the story. The deaths
  are not the centre. The centre is the slow recognition that private desire has entered
  a world ruled by older debts.

  The visual language should remain spare, severe, and cinematic. Black space is not
  background; it is consequence. Light does not comfort; it exposes. By the final
  image, the tragedy belongs less to the men who die than to the women who remain
  as its witnesses, archives, and unwilling survivors.'
