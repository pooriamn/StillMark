title: Constellations
years: Constellations
mood: fractured, intimate, restrained, temporal, tender, cinematic
description: 'Constellations is approached here not as science fiction and not as
  decorative multiverse imagery, but as a fractured love story built from ordinary
  evidence: a glass, a chair, a honey jar, a notebook, a coat, a suitcase, and the
  distances that keep changing between two people.


  This sequence follows Marianne and Roland through possibility, hesitation, tenderness,
  illness, helpless care, and final residue. The images do not need stars or cosmic
  symbolism. Time is visible through repetition, misalignment, blur, and the feeling
  that every scene might have happened differently somewhere else.


  The visual language should remain spare, intimate, and unsentimental. Black space
  is not emptiness; it is the field of all the versions that did not survive. Light
  does not solve the story; it briefly isolates one possible life before another replaces
  it. By the final image, the love is no longer held by the bodies alone. It has moved
  into the objects left behind.'
