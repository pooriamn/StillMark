slug: witness-horizon
title: Witness Horizon
years: Water and open ground
mood: Distance, reflection, witness trees, and small figures held against water and open ground.
description: Across water, open ground, and horizon lines, human figures remain small without disappearing. Trees recur as witnesses, reflections double what cannot be held, and distance becomes the real subject. These images are less about event than about how presence lands inside open space.
card_summary: Figures, water, and witness trees hold distance without letting presence disappear.
story_opening_text: 'The opening frames establish the basic tension of the series: a small human presence held inside water, reflection, and open ground.'
story_sequence_text: As the sequence advances, witness trees and reflective surfaces repeat until distance itself becomes the central subject.
story_closing_text: The ending leaves intimacy unresolved. Presence remains possible, but only within a silence larger than the figures it holds.
