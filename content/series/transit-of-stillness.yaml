slug: transit-of-stillness
title: Transit of Stillness
years: Road, water, and the passing body
mood: Cyclists, paddlers, witness trees, and mirrored surfaces where motion is held inside stillness.
description: 'These works turn on a tension the archive has only touched so far: movement crossing reflective space without breaking its calm. Road and water become parallel surfaces of passage, where cyclists and paddlers appear not as action subjects but as brief measures against witness trees, open sky, and dark reflection. The series is less about travel than about transit held inside stillness, where motion leaves almost no mark except its temporary doubling.'
card_summary: Cyclists, paddlers, roads, and mirrored surfaces turn movement into a brief disturbance inside stillness.
story_opening_text: The opening images establish reflection as the primary surface of the story, where motion appears without fully breaking calm.
story_sequence_text: Cyclists, paddlers, roads, and water repeat as parallel passages, letting movement register as a temporary disturbance inside stillness.
story_closing_text: The ending returns the viewer to stillness, but with motion now felt as an afterimage rather than an event.
