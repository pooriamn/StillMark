slug: woyzeck
title: Woyzeck
years: '2026'
mood: severe, pressured, unstable, mournful, cinematic, restrained
description: '*Woyzeck* is treated here not simply as the story of a murder, but as
  the slow destruction of a human being under class humiliation, bodily exploitation,
  jealousy, poverty, and mental fracture. The violence at the centre of the play matters,
  but what matters more is how long the world spends preparing the conditions around
  it.


  This sequence follows that pressure through a small set of recurring witnesses:
  a chair, a window, a field, earrings, a tavern, a knife, and finally the pond. The
  images are not meant to behave like illustrations. They behave like evidence - frames
  caught slightly before or slightly after the clean dramatic climax, when the human
  cost is harder to ignore.


  The visual language remains spare, severe, and unromantic. Black space does not
  decorate the stage; it bears down on it. Light does not comfort; it exposes. By
  the end, the tragedy is no longer only in the act itself, but in the residue it
  leaves behind - a place remembering what the people within it could not carry.'
