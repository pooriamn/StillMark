slug: weather-of-presence
title: Weathered Nearness
years: Wind, rain, and shared exposure
mood: 'Weather strips relation to its most difficult form: exposure shared without sentiment.'
description: Weather is not used here as mood or backdrop. It is the condition that reveals what remains when comfort disappears. Wind, rain, open ground, and shared shelter place solitude and companionship under the same pressure, where nearness becomes visible not as ease, but as exposure carried together or alone.
card_summary: Wind, rain, and shared exposure make nearness visible through pressure rather than comfort.
story_opening_text: 'The sequence opens with exposure: weather immediately tests what nearness can endure.'
story_sequence_text: Wind, rain, and shared shelter turn relation into pressure, making companionship visible through difficulty rather than comfort.
story_closing_text: The last images keep that tension intact, leaving nearness as something weathered, carried, and never fully secured.
