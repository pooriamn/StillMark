<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ head.title }}</title>
  <meta name="description" content="{{ head.description }}">
  <meta name="author" content="{{ head.author }}">
  <meta name="robots" content="{{ head.robots }}">
  <meta name="theme-color" content="#18191a">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="{{ head.canonical }}">
  <meta property="og:site_name" content="{{ head.site_name }}">
  <meta property="og:type" content="{{ head.og_type }}">
  <meta property="og:title" content="{{ head.title }}">
  <meta property="og:description" content="{{ head.og_description }}">
  <meta property="og:url" content="{{ head.canonical }}">
  <meta property="og:image" content="{{ head.image }}">
  <meta property="og:image:alt" content="{{ head.image_alt }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="/assets/fonts/bodoni-moda-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/schibsted-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  {%- if head.preload %}
  <link rel="preload" as="image" type="{{ head.preload.type }}" imagesrcset="{{ head.preload.srcset }}" imagesizes="{{ head.preload.sizes }}" fetchpriority="high">
  {%- endif %}
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/icons/favicon-32x32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="/site.webmanifest">
  {%- if head.analytics_id %}
  <meta name="stillmark-analytics" content="{{ head.analytics_id }}">
  <script src="/assets/js/consent.js" defer></script>
  {%- endif %}
  <script type="application/ld+json" data-base-schema>{{ head.base_schema }}</script>
  <script type="application/ld+json" data-page-schema>{{ head.page_schema }}</script>
</head>
