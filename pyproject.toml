[project]
name = "stillmark"
version = "2.0.0"
description = "STILLMRK monochrome photography portfolio: static site build and content tools."
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
  "Pillow>=11.3,<13",
  "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
panel = ["PySide6>=6.8,<7", "ruamel.yaml>=0.18,<0.19"]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
